openapi: 3.1.0
info:
  title: Fullstack Forge API
  version: 1.0.0
components:
  schemas: {}
  parameters: {}
paths:
  /health:
    get:
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - error
                required:
                  - status
  /auth/signup:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
                  minLength: 1
              required:
                - email
                - password
                - name
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      role:
                        type: string
                        enum:
                          - customer
                          - operator
                          - admin
                      status:
                        type: string
                        enum:
                          - active
                          - locked
                          - withdrawn
                    required:
                      - id
                      - email
                      - name
                      - role
                      - status
                required:
                  - user
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
  /auth/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      role:
                        type: string
                        enum:
                          - customer
                          - operator
                          - admin
                      status:
                        type: string
                        enum:
                          - active
                          - locked
                          - withdrawn
                    required:
                      - id
                      - email
                      - name
                      - role
                      - status
                required:
                  - user
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
  /auth/refresh:
    post:
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
  /auth/logout:
    post:
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
  /auth/me:
    get:
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      role:
                        type: string
                        enum:
                          - customer
                          - operator
                          - admin
                      status:
                        type: string
                        enum:
                          - active
                          - locked
                          - withdrawn
                    required:
                      - id
                      - email
                      - name
                      - role
                      - status
                required:
                  - user
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
  /auth/oauth/{provider}/start:
    get:
      parameters:
        - schema:
            type: string
            enum:
              - google
              - kakao
          required: true
          name: provider
          in: path
        - schema:
            type: string
          required: false
          name: redirect
          in: query
      responses:
        "302":
          description: Redirect to oauth provider
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
  /auth/oauth/{provider}/callback:
    get:
      parameters:
        - schema:
            type: string
            enum:
              - google
              - kakao
          required: true
          name: provider
          in: path
        - schema:
            type: string
          required: true
          name: code
          in: query
        - schema:
            type: string
          required: true
          name: state
          in: query
      responses:
        "302":
          description: Redirect to callback success page
        "400":
          description: Invalid oauth state
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
        "401":
          description: OAuth exchange failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
  /auth/password-reset/request:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
  /auth/password-reset/confirm:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 8
              required:
                - token
                - password
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
  /admin/dashboard:
    get:
      responses:
        "200":
          description: Admin dashboard access status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  role:
                    type: string
                    nullable: true
                    enum:
                      - customer
                      - operator
                      - admin
                      - null
                required:
                  - ok
                  - role
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
  /admin/redrive:
    post:
      responses:
        "200":
          description: Redrive requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  action:
                    type: string
                    enum:
                      - redrive_started
                  requestedBy:
                    type: string
                    nullable: true
                required:
                  - ok
                  - action
                  - requestedBy
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
  /products:
    get:
      parameters:
        - schema:
            type: string
          required: false
          name: q
          in: query
        - schema:
            type: string
          required: false
          name: category
          in: query
        - schema:
            type: string
            enum:
              - active
              - low_stock
              - out_of_stock
              - discontinued
          required: false
          name: status
          in: query
        - schema:
            type: string
          required: false
          name: brand
          in: query
        - schema:
            type: string
            enum:
              - latest
              - price
              - name
          required: false
          name: sort
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
          required: false
          name: order
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 100
          required: false
          name: page_size
          in: query
      responses:
        "200":
          description: Catalog product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        sku:
                          type: string
                        name:
                          type: string
                        brand:
                          type: string
                        categoryId:
                          type: string
                        categoryName:
                          type: string
                        price:
                          type: integer
                          minimum: 0
                        weight:
                          type: integer
                          minimum: 0
                        status:
                          type: string
                          enum:
                            - active
                            - low_stock
                            - out_of_stock
                            - discontinued
                        isSubstitutable:
                          type: boolean
                        thumbUrl:
                          type: string
                          format: uri
                        detailUrl:
                          type: string
                          format: uri
                        availableStock:
                          type: integer
                          minimum: 0
                        canPurchase:
                          type: boolean
                      required:
                        - id
                        - sku
                        - name
                        - brand
                        - categoryId
                        - categoryName
                        - price
                        - weight
                        - status
                        - isSubstitutable
                        - thumbUrl
                        - detailUrl
                        - availableStock
                        - canPurchase
                  page:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                  pageSize:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                  total:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                  hasPreviousPage:
                    type: boolean
                  hasNextPage:
                    type: boolean
                required:
                  - items
                  - page
                  - pageSize
                  - total
                  - totalPages
                  - hasPreviousPage
                  - hasNextPage
  /products/search:
    get:
      parameters:
        - schema:
            type: string
          required: false
          name: q
          in: query
        - schema:
            type: string
          required: false
          name: category
          in: query
        - schema:
            type: string
            enum:
              - active
              - low_stock
              - out_of_stock
              - discontinued
          required: false
          name: status
          in: query
        - schema:
            type: string
          required: false
          name: brand
          in: query
        - schema:
            type: string
            enum:
              - latest
              - price
              - name
          required: false
          name: sort
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
          required: false
          name: order
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 100
          required: false
          name: page_size
          in: query
      responses:
        "200":
          description: Catalog product search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        sku:
                          type: string
                        name:
                          type: string
                        brand:
                          type: string
                        categoryId:
                          type: string
                        categoryName:
                          type: string
                        price:
                          type: integer
                          minimum: 0
                        weight:
                          type: integer
                          minimum: 0
                        status:
                          type: string
                          enum:
                            - active
                            - low_stock
                            - out_of_stock
                            - discontinued
                        isSubstitutable:
                          type: boolean
                        thumbUrl:
                          type: string
                          format: uri
                        detailUrl:
                          type: string
                          format: uri
                        availableStock:
                          type: integer
                          minimum: 0
                        canPurchase:
                          type: boolean
                      required:
                        - id
                        - sku
                        - name
                        - brand
                        - categoryId
                        - categoryName
                        - price
                        - weight
                        - status
                        - isSubstitutable
                        - thumbUrl
                        - detailUrl
                        - availableStock
                        - canPurchase
                  page:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                  pageSize:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                  total:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                  hasPreviousPage:
                    type: boolean
                  hasNextPage:
                    type: boolean
                required:
                  - items
                  - page
                  - pageSize
                  - total
                  - totalPages
                  - hasPreviousPage
                  - hasNextPage
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
  /products/{id}:
    get:
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Catalog product detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  sku:
                    type: string
                  name:
                    type: string
                  brand:
                    type: string
                  categoryId:
                    type: string
                  categoryName:
                    type: string
                  price:
                    type: integer
                    minimum: 0
                  weight:
                    type: integer
                    minimum: 0
                  status:
                    type: string
                    enum:
                      - active
                      - low_stock
                      - out_of_stock
                      - discontinued
                  isSubstitutable:
                    type: boolean
                  thumbUrl:
                    type: string
                    format: uri
                  detailUrl:
                    type: string
                    format: uri
                  availableStock:
                    type: integer
                    minimum: 0
                  canPurchase:
                    type: boolean
                  description:
                    type: string
                required:
                  - id
                  - sku
                  - name
                  - brand
                  - categoryId
                  - categoryName
                  - price
                  - weight
                  - status
                  - isSubstitutable
                  - thumbUrl
                  - detailUrl
                  - availableStock
                  - canPurchase
                  - description
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
  /categories:
    get:
      responses:
        "200":
          description: Catalog category list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        slug:
                          type: string
                        displayOrder:
                          type: integer
                          minimum: 0
                        isActive:
                          type: boolean
                      required:
                        - id
                        - name
                        - slug
                        - displayOrder
                        - isActive
                required:
                  - items
